apiVersion: apps/v1
kind: Deployment

metadata:
  name: rate-limiter
  namespace: rate-limiter

spec:
  replicas: 2

  selector:
    matchLabels:
      app: rate-limiter

  template:
    metadata:
      labels:
        app: rate-limiter

    spec:
      containers:
        - name: rate-limiter

          image: vanshparate/rate-limiting-service:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: rate-limiter-config

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10